name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Make the Android app
        run: |
          mkdir app && cd app
          npm init -y
          npm install @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8 @capgo/capacitor-health@8 @capacitor-community/background-geolocation@1.3.1 leaflet@1.9.4
          mkdir www
          cp ../walk.html www/index.html
          cp -r node_modules/leaflet/dist www/leaflet
          sed -i 's#https://unpkg.com/leaflet@1.9.4/dist/#leaflet/#g' www/index.html
          cat > www/privacypolicy.html <<'EOF'
          <!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Privacy</title></head>
          <body style="font-family:sans-serif;padding:20px;line-height:1.5"><h1>Walk privacy</h1>
          <p>Walk reads your steps, distance, calories and workouts from Health Connect only to show them to you in the app.</p>
          <p>Your walks and health data stay on this phone. Walk does not send them anywhere.</p></body></html>
          EOF
          echo '{"appId":"com.walk.tracker","appName":"Walk","webDir":"www","android":{"useLegacyBridge":true}}' > capacitor.config.json
          npx cap add android
          sed -i 's/minSdkVersion = 2[0-9]/minSdkVersion = 26/' android/variables.gradle
          grep minSdk android/variables.gradle
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../../Walk.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Walk app (build ${{ github.run_number }})
          files: Walk.apk
